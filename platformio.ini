; PlatformIO 工程配置 —— 微雪 ESP32-S3-Touch-AMOLED-2.16
; 用法：pio run -t upload   （首次需 USB-C 数据线）
; 说明：PC 端用 CMakeLists.txt 编译模拟器，本文件仅用于设备。

[env:waveshare_amoled_216]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 硬件：16MB Flash + 8MB PSRAM（OPI）
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

build_flags =
    ; 设备端 lv_conf.h 单独放在 device/，PC 模拟器不会误用它
    -I device
    ; 微雪的 pin_config.h 所在目录（Mylibrary 不是标准库，需手动加头文件路径）
    -I vendor/waveshare-demo/examples/arduino/libraries/Mylibrary
    -I src
    -I src/ui
    -I src/data
    -I src/port
    -I src/port/audio
    -I src/net
    -I src/vendor/miniz
    ; miniz 只用 tinfl 解压（和风 gzip），裁掉压缩/归档/stdio 省空间
    -DMINIZ_NO_ARCHIVE_APIS
    -DMINIZ_NO_ARCHIVE_WRITING_APIS
    -DMINIZ_NO_STDIO
    -DMINIZ_NO_TIME
    -DMINIZ_NO_DEFLATE_APIS
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=3

; GFX / SensorLib 由下方 vendor 目录提供，与微雪官方示例同版本（GFX 1.6.4 / SensorLib 0.3.3）
lib_deps =
    lvgl/lvgl@^9.3.0

lib_extra_dirs =
    vendor/waveshare-demo/examples/arduino/libraries

; 只编译设备端，排除 PC 模拟器入口
build_src_filter =
    +<*>
    -<main_pc.c>

monitor_speed = 115200
upload_speed = 921600
